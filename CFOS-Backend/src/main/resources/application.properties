spring.application.name=canteen

# ===================================================================
# DATABASE SEEDER (set to false to disable on startup)
# ===================================================================
app.seeder.enabled=false

# ===================================================================
# DATABASE CONNECTION CONFIGURATION (MySQL)
# ===================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/cfosdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=sasa@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA / HIBERNATE CONFIGURATION
# ===================================================================
# 'validate' ensures your Java entities match the existing DB tables exactly.
# Change to 'update' if you want Hibernate to automatically create/modify tables.
spring.jpa.hibernate.ddl-auto=update

# Specifies MySQL 8+ features (ideal for modern MySQL instances)
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Set to true to view SQL queries in your console output (great for debugging)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# LOGGING CONFIGURATION
# ===================================================================

# Application-level logging
logging.level.root=WARN
logging.level.com.canteen=INFO

# Show request/response logging from our custom filter
logging.level.com.canteen.config.RequestLoggingFilter=INFO

# Hibernate SQL (set to DEBUG to see queries, WARN to silence them)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.hibernate.tool.schema=WARN

# Silence noisy Spring internals
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN

# Log pattern: timestamp [level] logger - message
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %clr(%-5level){green} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} : %msg%n

server.port=8081

